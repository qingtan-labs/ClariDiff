name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  package:
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build Universal 2 package
        run: ./scripts/build-release.sh
      - name: Verify architectures and signatures
        run: |
          lipo -verify_arch arm64 x86_64 dist/dmg-root/ClariDiff.app/Contents/MacOS/ClariDiff
          lipo -verify_arch arm64 x86_64 dist/claridiff-1.0.0-macos-universal
          codesign --verify --deep --strict dist/dmg-root/ClariDiff.app
          codesign --verify --strict dist/claridiff-1.0.0-macos-universal
          hdiutil verify dist/ClariDiff-1.0.0-Universal.dmg
      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
