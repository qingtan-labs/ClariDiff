name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build Universal 2 release
        run: ./scripts/build-release.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/ClariDiff-1.0.0-Universal.dmg
          dist/claridiff-1.0.0-macos-universal
          dist/SHA256SUMS
          --title "ClariDiff 1.0.0"
          --notes-file docs/releases/1.0.0.md
