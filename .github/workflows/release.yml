name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build Universal 2 release
        run: ./scripts/build-release.sh
      - name: Verify release assets
        run: |
          lipo -verify_arch arm64 x86_64 dist/dmg-root/ClariDiff.app/Contents/MacOS/ClariDiff
          lipo -verify_arch arm64 x86_64 dist/claridiff-1.0.0-macos-universal
          codesign --verify --deep --strict dist/dmg-root/ClariDiff.app
          codesign --verify --strict dist/claridiff-1.0.0-macos-universal
          hdiutil verify dist/ClariDiff-1.0.0-Universal.dmg
          cd dist
          shasum -a 256 -c SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/ClariDiff-1.0.0-Universal.dmg
          dist/claridiff-1.0.0-macos-universal
          dist/SHA256SUMS
          --title "ClariDiff 1.0.0"
          --notes-file docs/releases/1.0.0.md
