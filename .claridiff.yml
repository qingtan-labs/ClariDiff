version: 1

ignore:
  - /updatedAt
  - /requestId
  - /items/*/traceId

arrays:
  /users:
    matchBy: id
    order: ignore
  /roles:
    order: ignore

numbers:
  defaultTolerance: 0.001
  relativeTolerancePercent: 0.1

strings:
  trimWhitespace: true
  ignoreCase: false
  normalizeLineEndings: true
  normalizeISODates: false
  coerceNumericStrings: false
